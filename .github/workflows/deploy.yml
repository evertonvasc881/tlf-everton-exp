name: CI/CD — tlf-everton-exp

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  APP_NAME: tlf-everton-exp
  APP_ROOT: .
  MULE_RUNTIME: 4.9-java17
  ANYPOINT_URI: https://anypoint.mulesoft.com
  BUSINESS_GROUP_ID: 5834a905-793c-4621-9565-b8bc11830a87
  REGION: sa-east-1
  EXCHANGE_URL: https://maven.anypoint.mulesoft.com/api/v3/organizations/bda6429f-df0d-477d-80cb-e10089cffdee/maven

jobs:
  build:
    name: Build e Testes MUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configurar settings.xml (Anypoint Exchange)
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "${{ env.EXCHANGE_URL }}",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "false" }
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "false" }
              }
            ]
          servers: |
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Build e MUnit
        working-directory: ${{ env.APP_ROOT }}
        run: |
          mvn clean package \
            -DskipTests=false \
            -Denv=dev \
            -Dsecurity.key=${{ secrets.MULE_SECURITY_KEY }} \
            -DconnectedAppClientId=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -DconnectedAppClientSecret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            --no-transfer-progress \
            --batch-mode
        env:
          MAVEN_OPTS: "-Xmx1g"

      - name: Publicar relatorio MUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: munit-coverage-report
          path: ${{ env.APP_ROOT }}/target/site/munit/coverage/
          retention-days: 30

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mule-artifact
          path: ${{ env.APP_ROOT }}/target/*.jar
          retention-days: 7

  deploy-design:
    name: Deploy — Design
    runs-on: ubuntu-latest
    needs: build
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: design

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configurar settings.xml (Anypoint Exchange)
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "${{ env.EXCHANGE_URL }}",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "false" }
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "false" }
              }
            ]
          servers: |
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Deploy CloudHub — Design
        working-directory: ${{ env.APP_ROOT }}
        run: |
          mvn deploy \
            -DmuleDeploy \
            -DskipTests=true \
            -Denv=dev \
            -Denv.short=design \
            -Dsecurity.key=${{ secrets.MULE_SECURITY_KEY }} \
            -DconnectedAppClientId=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -DconnectedAppClientSecret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            -DbusinessGroupId=${{ env.BUSINESS_GROUP_ID }} \
            -Dregion=${{ env.REGION }} \
            -Dworker=1 \
            -DworkerType=MICRO \
            -DAPI_MANAGER_ID=${{ secrets.DESIGN_API_MANAGER_ID }} \
            -DREQUEST_SYS_CLIENT_ID=${{ secrets.DESIGN_REQUEST_SYS_CLIENT_ID }} \
            -DREQUEST_SYS_CLIENT_SECRET=${{ secrets.DESIGN_REQUEST_SYS_CLIENT_SECRET }} \
            -DTRUSTSTORE_MULE_PASSWORD=${{ secrets.DESIGN_TRUSTSTORE_PASSWORD }} \
            -Danypoint.platform.client_id=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -Danypoint.platform.client_secret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            --no-transfer-progress \
            --batch-mode
