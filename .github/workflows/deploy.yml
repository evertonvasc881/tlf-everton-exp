name: CI/CD — tlf-everton-exp

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy manual'
        required: true
        type: choice
        options:
          - dev
          - hmg
          - prod
        default: dev
      deploy_reason:
        description: 'Justificativa do deploy manual (obrigatorio para prod)'
        required: false
        type: string

env:
  APP_NAME: tlf-everton-exp
  APP_ROOT: .
  MULE_RUNTIME: 4.9-java17
  ANYPOINT_URI: https://anypoint.mulesoft.com
  BUSINESS_GROUP_ID: 5834a905-793c-4621-9565-b8bc11830a87
  REGION: sa-east-1

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: BUILD + TEST (MUnit)
  # Executa em todo push/PR — gating obrigatorio
  # ─────────────────────────────────────────────
  build:
    name: Build e Testes MUnit
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment != 'prod'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configurar settings.xml (Anypoint Exchange)
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "false" }
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "false" }
              }
            ]
          servers: |
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Build e MUnit
        working-directory: ${{ env.APP_ROOT }}
        run: |
          mvn clean package \
            -DskipTests=false \
            -Denv=dev \
            -Dsecurity.key=${{ secrets.MULE_SECURITY_KEY }} \
            -DconnectedAppClientId=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -DconnectedAppClientSecret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            --no-transfer-progress \
            --batch-mode
        env:
          MAVEN_OPTS: "-Xmx1g"

      - name: Publicar relatorio de cobertura MUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: munit-coverage-report
          path: ${{ env.APP_ROOT }}/target/site/munit/coverage/
          retention-days: 30

      - name: Publicar JAR para deploy
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mule-artifact
          path: ${{ env.APP_ROOT }}/target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: DEPLOY DEV
  # Automatico apos build passar em branch main/develop
  # ─────────────────────────────────────────────
  deploy-dev:
    name: Deploy — DEV
    runs-on: ubuntu-latest
    needs: build
    if: >
      success() &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
      )
    environment:
      name: dev
      url: https://anypoint.mulesoft.com/cloudhub/#/console/environments/dev/applications/dev-tlf-everton-exp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configurar settings.xml (Anypoint Exchange)
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven"
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/"
              }
            ]
          servers: |
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Deploy CloudHub 2.0 — DEV
        working-directory: ${{ env.APP_ROOT }}
        run: |
          mvn deploy \
            -DmuleDeploy \
            -DskipTests=true \
            -Denv=dev \
            -Denv.short=dev \
            -Dsecurity.key=${{ secrets.MULE_SECURITY_KEY }} \
            -DconnectedAppClientId=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -DconnectedAppClientSecret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            -DbusinessGroupId=${{ env.BUSINESS_GROUP_ID }} \
            -Dregion=${{ env.REGION }} \
            -Dworker=1 \
            -DworkerType=MICRO \
            -DAPI_MANAGER_ID=${{ secrets.DEV_API_MANAGER_ID }} \
            -DREQUEST_SYS_CLIENT_ID=${{ secrets.DEV_REQUEST_SYS_CLIENT_ID }} \
            -DREQUEST_SYS_CLIENT_SECRET=${{ secrets.DEV_REQUEST_SYS_CLIENT_SECRET }} \
            -DTRUSTSTORE_MULE_PASSWORD=${{ secrets.DEV_TRUSTSTORE_PASSWORD }} \
            -Danypoint.platform.client_id=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -Danypoint.platform.client_secret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            --no-transfer-progress \
            --batch-mode

      - name: Health Check — DEV
        run: |
          echo "Aguardando app inicializar (60s)..."
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dev-tlf-everton-exp.${{ env.BUSINESS_GROUP_ID }}.cloudhub.io/healthz" \
            --max-time 10 || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FALHA: Health check retornou $STATUS (esperado 200)"
            exit 1
          fi
          echo "OK: API saudavel em DEV"

  # ─────────────────────────────────────────────
  # JOB 3: DEPLOY HMG
  # Automatico apos deploy-dev em branch main
  # ─────────────────────────────────────────────
  deploy-hmg:
    name: Deploy — HMG
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: >
      success() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'hmg')
      )
    environment:
      name: hmg
      url: https://anypoint.mulesoft.com/cloudhub/#/console/environments/hmg/applications/hmg-tlf-everton-exp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configurar settings.xml (Anypoint Exchange)
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven"
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/"
              }
            ]
          servers: |
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Deploy CloudHub 2.0 — HMG
        working-directory: ${{ env.APP_ROOT }}
        run: |
          mvn deploy \
            -DmuleDeploy \
            -DskipTests=true \
            -Denv=hmg \
            -Denv.short=hmg \
            -Dsecurity.key=${{ secrets.MULE_SECURITY_KEY }} \
            -DconnectedAppClientId=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -DconnectedAppClientSecret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            -DbusinessGroupId=${{ env.BUSINESS_GROUP_ID }} \
            -Dregion=${{ env.REGION }} \
            -Dworker=1 \
            -DworkerType=MICRO \
            -DAPI_MANAGER_ID=${{ secrets.HMG_API_MANAGER_ID }} \
            -DREQUEST_SYS_CLIENT_ID=${{ secrets.HMG_REQUEST_SYS_CLIENT_ID }} \
            -DREQUEST_SYS_CLIENT_SECRET=${{ secrets.HMG_REQUEST_SYS_CLIENT_SECRET }} \
            -DTRUSTSTORE_MULE_PASSWORD=${{ secrets.HMG_TRUSTSTORE_PASSWORD }} \
            -Danypoint.platform.client_id=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -Danypoint.platform.client_secret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            --no-transfer-progress \
            --batch-mode

      - name: Health Check — HMG
        run: |
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hmg-tlf-everton-exp.${{ env.BUSINESS_GROUP_ID }}.cloudhub.io/healthz" \
            --max-time 10 || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FALHA: Health check retornou $STATUS (esperado 200)"
            exit 1
          fi
          echo "OK: API saudavel em HMG"

  # ─────────────────────────────────────────────
  # JOB 4: DEPLOY PROD
  # MANUAL OBRIGATORIO — workflow_dispatch apenas
  # Requer aprovacao no GitHub Environment "prod"
  # ─────────────────────────────────────────────
  deploy-prod:
    name: Deploy — PROD (Aprovacao Manual)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod'
    environment:
      name: prod
      url: https://anypoint.mulesoft.com/cloudhub/#/console/environments/prod/applications/prod-tlf-everton-exp

    steps:
      - name: Validar justificativa de deploy prod
        run: |
          if [ -z "${{ github.event.inputs.deploy_reason }}" ]; then
            echo "BLOQUEADO: deploy_reason e obrigatorio para producao."
            exit 1
          fi
          echo "Deploy prod autorizado por: ${{ github.actor }}"
          echo "Justificativa: ${{ github.event.inputs.deploy_reason }}"

      - name: Verificar checklist de bloqueadores prod
        run: |
          echo "=== VERIFICACAO PRE-DEPLOY PROD ==="
          echo "Confirme manualmente antes de prosseguir:"
          echo "  [ ] insecure=false no prod.yaml"
          echo "  [ ] Keystore real provisionado (nao placeholder)"
          echo "  [ ] API Console desativado (flow console removido ou protegido)"
          echo "  [ ] JSON Threat Protection ativo no API Manager"
          echo "  [ ] Client ID Enforcement confirmado no API Manager"
          echo "  [ ] Revisao LGPD aprovada"
          echo "  [ ] Security key prod configurada no GitHub Secrets"
          echo "Prosseguindo com deploy — responsabilidade do aprovador do environment."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configurar settings.xml (Anypoint Exchange)
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven"
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/"
              }
            ]
          servers: |
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Deploy CloudHub 2.0 — PROD
        working-directory: ${{ env.APP_ROOT }}
        run: |
          mvn deploy \
            -DmuleDeploy \
            -DskipTests=true \
            -Denv=prod \
            -Denv.short=prod \
            -Dsecurity.key=${{ secrets.PROD_MULE_SECURITY_KEY }} \
            -DconnectedAppClientId=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -DconnectedAppClientSecret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            -DbusinessGroupId=${{ env.BUSINESS_GROUP_ID }} \
            -Dregion=${{ env.REGION }} \
            -Dworker=1 \
            -DworkerType=SMALL \
            -DAPI_MANAGER_ID=${{ secrets.PROD_API_MANAGER_ID }} \
            -DREQUEST_SYS_CLIENT_ID=${{ secrets.PROD_REQUEST_SYS_CLIENT_ID }} \
            -DREQUEST_SYS_CLIENT_SECRET=${{ secrets.PROD_REQUEST_SYS_CLIENT_SECRET }} \
            -DTRUSTSTORE_MULE_PASSWORD=${{ secrets.PROD_TRUSTSTORE_PASSWORD }} \
            -Danypoint.platform.client_id=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -Danypoint.platform.client_secret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            --no-transfer-progress \
            --batch-mode

      - name: Health Check — PROD
        run: |
          sleep 90
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://prod-tlf-everton-exp.${{ env.BUSINESS_GROUP_ID }}.cloudhub.io/healthz" \
            --max-time 10 || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FALHA CRITICA: Health check prod retornou $STATUS"
            echo "Acione rollback imediato no Anypoint Platform."
            exit 1
          fi
          echo "OK: API saudavel em PROD"

      - name: Registrar deploy prod no sumario
        if: success()
        run: |
          echo "## Deploy PROD Concluido" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App | prod-tlf-everton-exp |" >> $GITHUB_STEP_SUMMARY
          echo "| Runtime | ${{ env.MULE_RUNTIME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Responsavel | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Justificativa | ${{ github.event.inputs.deploy_reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Exchange | https://anypoint.mulesoft.com/exchange/5834a905-793c-4621-9565-b8bc11830a87/tlf-everton-exp/1.0.0/ |" >> $GITHUB_STEP_SUMMARY
